<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Watch Kenchanaman on YouTube">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2bd6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'SF Mono','Menlo','Consolas','Courier New',monospace; }
    .name { font-size: 26px; font-weight: 700; fill: #ffffff; letter-spacing: 2px; }
    .desc { font-size: 14px; fill: #7ee8ff; letter-spacing: 1px; }
    .cta { font-size: 15px; font-weight: 700; fill: #050816; letter-spacing: 2px; }
    @keyframes ring { 0% { r: 26; opacity: .8; } 100% { r: 44; opacity: 0; } }
    .ring { animation: ring 2.2s ease-out infinite; }
    .ring2 { animation: ring 2.2s ease-out infinite 1.1s; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .arrow { animation: nudge 1.4s ease-in-out infinite; }
  </style>
  <rect x="2" y="2" width="896" height="106" rx="16" fill="#080b1e" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
  <g transform="translate(70 55)">
    <circle class="ring" r="26" fill="none" stroke="#ff2bd6" stroke-width="2"/>
    <circle class="ring2" r="26" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <circle r="26" fill="url(#neon)" filter="url(#glow)"/>
    <path d="M-8 -12L14 0L-8 12Z" fill="#050816"/>
  </g>
  <text class="mono name" x="130" y="52">KENCHANAMAN</text>
  <text class="mono desc" x="130" y="78">YouTube channel &#8212; videos for Korean viewers, made in Japan</text>
  <g>
    <rect x="690" y="30" width="170" height="50" rx="25" fill="url(#neon)" filter="url(#glow)"/>
    <text class="mono cta" x="727" y="61">WATCH</text>
    <g class="arrow"><path d="M810 55H832M824 47L832 55L824 63" fill="none" stroke="#050816" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>
